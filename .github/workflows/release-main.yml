name: "[CI] Main Image Build & Push"

# main에 들어온 커밋으로 배포 이미지를 만든다.
# 이 워크플로가 성공해야 deploy-railway.yml이 배포를 시작한다(workflow_run 연결).
on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  image-release:
    name: "[CI] Docker 이미지 빌드 & GHCR 푸시"
    runs-on: ubuntu-22.04

    # 배포 잡이 어떤 태그를 올릴지 알아야 한다.
    # 환경변수는 잡 경계를 넘지 못하므로 출력으로 넘긴다.
    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}

    steps:
      - name: "[1] 저장소 코드 다운로드 (Checkout)"
        uses: actions/checkout@v4

      - name: "[2] Docker Buildx 설정"
        uses: docker/setup-buildx-action@v3

      - name: "[3] GitHub Container Registry(GHCR) 로그인"
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT }}

      - name: "[4] 이미지 태그 환경 변수 설정"
        id: meta
        # latest 외에 커밋 SHA 태그도 남긴다.
        # 배포가 어느 커밋인지 추적할 수 있고, 문제 시 이전 태그로 되돌릴 수 있다.
        run: |
          echo "REPO_URL=ghcr.io/${{ github.repository }}" >> $GITHUB_ENV
          echo "IMAGE_TAG=${GITHUB_SHA::7}" >> $GITHUB_ENV
          echo "image_tag=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      - name: "[5] 모놀리식 이미지 빌드"
        # Dockerfile 내부에서 Node 설치 -> ./gradlew build -PwithFrontend -x test 가 실행된다.
        # 테스트는 PR 단계(build.yml)에서 이미 돌렸다.
        # --build-arg 로 넣은 값은 이미지에 ENV 로 박혀 GET /version 이 그대로 돌려준다.
        # 배포된 것이 정말 이 커밋인지 밖에서 확인하는 근거가 된다.
        run: |
          docker build \
            --build-arg GIT_SHA="$GITHUB_SHA" \
            --build-arg IMAGE_TAG="$IMAGE_TAG" \
            --build-arg BUILT_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            -t "$REPO_URL:latest" \
            -t "$REPO_URL:$IMAGE_TAG" \
            .

      - name: "[6] GHCR 푸시"
        run: |
          docker push "$REPO_URL:latest"
          docker push "$REPO_URL:$IMAGE_TAG"

      - name: "[7] 배포될 이미지 요약"
        run: |
          echo "### 배포 대상 이미지" >> $GITHUB_STEP_SUMMARY
          echo "- \`$REPO_URL:$IMAGE_TAG\` (커밋 ${GITHUB_SHA::7})" >> $GITHUB_STEP_SUMMARY

  deploy:
    name: "[CD] Railway 배포"
    needs: image-release

    # 이미지 빌드와 같은 워크플로에 두고 needs로 묶는다.
    # 별도 워크플로 + workflow_run 으로 연결했더니 트리거 자체가 생성되지 않았다
    # (배포 워크플로 실행 17건이 전부 push 이벤트였고 workflow_run 은 0건).
    # needs 는 같은 실행 안에서 순서가 보장되므로 "이미지가 올라간 뒤 배포"가 확실하다.
    #
    # 배포 로직 자체는 deploy-image.yml 하나로 모은다. 롤백(workflow_dispatch)과
    # semver 릴리스가 같은 경로를 타야 "롤백해봤더니 다르게 동작"하는 일이 없다.
    # :latest 가 아니라 커밋별 불변 태그를 물린다 - redeploy 는 태그를 다시 당길
    # 뿐이라, :latest 로 두면 무엇이 떠 있는지도 모르고 되돌릴 수도 없었다.
    uses: ./.github/workflows/deploy-image.yml
    with:
      image_tag: ${{ needs.image-release.outputs.image_tag }}
    secrets: inherit
