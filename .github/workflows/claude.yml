name: "[BOT] Claude 코드 작업"

# 모바일에서 이슈나 PR에 "@claude ..." 라고 코멘트하면 Claude가 코드를 고쳐 PR을 연다.
# 배포는 그 PR을 main 에 머지하면 release-main.yml이 이어받는다.
#
# 멘션 감지는 액션이 알아서 한다(기본 트리거 문구 @claude). 별도 if 조건을 걸지 않는다.
# 프로젝트 규칙은 저장소 루트의 CLAUDE.md를 그대로 따른다.
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned, labeled]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    name: "[BOT] 지시 수행"
    runs-on: ubuntu-22.04

    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write

    steps:
      - name: "[1] 저장소 코드 다운로드 (Checkout)"
        uses: actions/checkout@v4
        with:
          # 기본값(1커밋)이면 브랜치를 따거나 diff를 보기 어렵다.
          fetch-depth: 0
          # GITHUB_TOKEN으로 만든 PR에는 다른 워크플로가 발동하지 않는다.
          # BOT_PAT를 등록해두면 Claude가 연 PR에도 build.yml(테스트/빌드 검증)이 붙는다.
          token: ${{ secrets.BOT_PAT || secrets.GITHUB_TOKEN }}

      - name: "[2] Claude 실행"
        uses: anthropics/claude-code-action@v1
        with:
          # Pro/Max 구독을 쓰는 경우. API 키로 과금하려면 이 줄을 지우고
          # anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }} 로 바꾼다.
          # 두 가지를 동시에 넣지 말 것.
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.BOT_PAT || secrets.GITHUB_TOKEN }}

          # 액션의 기본 도구에는 파일을 수정하는 Edit/Write가 없다.
          # 이게 빠지면 Claude가 코드를 읽고 코멘트만 남긴 뒤 아무것도 고치지 못한 채
          # 정상 종료한다. 실행이 success로 뜨고 진행 상황 코멘트까지 달려서 알아채기 어렵다.
          # (이슈 #45: 9턴만 쓰고 종료, 브랜치 미생성, permission_denials_count=0)
          # --allowedTools는 기본 도구를 덮어쓰지 않고 더한다.
          # gradlew/npm은 고친 코드를 커밋 전에 Claude가 직접 검증하도록 함께 연다.
          # 턴이 모자라면 커밋 직전에 끊긴다. 이슈 #48이 60턴을 다 쓰고
          # "Reached maximum number of turns (60)"로 실패했다 — 브랜치명까지 정해놓고
          # push를 못 해 PR이 열리지 않았다. 이 저장소 작업 규모에는 60이 부족하다.
          #
          # 허용 목록에 없는 명령을 시도하면 거부되면서 턴만 소모된다(#48에서 9회).
          # 프론트 빌드가 `cd frontend && npm run build`이므로 cd도 함께 열어야 한다.
          # (npm --prefix는 cwd를 바꾸지 않아 대안이 되지 못한다. 실측 확인함)
          claude_args: |
            --max-turns 150
            --allowedTools "Edit,Write,Bash(cd:*),Bash(npm:*),Bash(npx:*),Bash(./gradlew:*),Bash(ls:*),Bash(cat:*),Bash(mkdir:*)"
