name: "[CD] Railway 이미지 배포"

# Railway 서비스가 바라보는 이미지를 지정한 태그로 "고정"하고 배포한다.
#
# 왜 railway CLI 를 쓰지 않는가:
#   railway redeploy 는 서비스에 설정된 태그를 그대로 다시 당긴다. 그 태그가
#   :latest 면 언제나 그 시점의 최신 다이제스트를 가져오므로, 배포가 재현되지
#   않고 롤백도 불가능하다(Railway 문서: "For tags without versions ... Railway
#   redeploys the existing tag to pull the latest image digest").
#   그리고 CLI 4.16.1 에는 이미지 태그를 바꾸는 명령 자체가 없다.
#   따라서 public GraphQL API 로 소스 이미지를 바꾼 뒤 배포한다.
#
# 토큰:
#   RAILWAY_API_TOKEN 은 account 또는 workspace 토큰이어야 한다.
#   프로젝트 토큰(RAILWAY_PROJECT_TOKEN)으로는 읽기만 되고 쓰기가 막힌다 -
#   serviceInstanceUpdate 가 "Not Authorized" 로 거절되는 것을 실측했다.
#   https://railway.com/account/tokens 에서 발급한다.
#
# 사용처:
#   - release-main.yml 이 workflow_call 로 부른다(커밋 sha 태그 배포)
#   - release-tag.yml 이 workflow_call 로 부른다(semver 태그 배포)
#   - 롤백은 workflow_dispatch 로 직접 실행한다(되돌릴 태그를 입력)

on:
  workflow_call:
    inputs:
      image_tag:
        required: true
        type: string
      # 호출 쪽에서는 항상 실제 배포다. 아래 조건식이 입력 없음(null)에 기대지
      # 않도록 명시적으로 선언해 둔다.
      dry_run:
        required: false
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      image_tag:
        description: "배포할 GHCR 이미지 태그 (예: a1b2c3d, v1.2.0). 롤백은 여기에 이전 태그를 넣는다"
        required: true
        type: string
      dry_run:
        description: "실제로 바꾸지 않고 현재 상태와 바뀔 내용만 출력한다"
        required: false
        type: boolean
        default: true

env:
  RAILWAY_API: https://backboard.railway.com/graphql/v2

jobs:
  deploy:
    name: "[CD] Railway 재배포"
    runs-on: ubuntu-latest

    steps:
      - name: "[1] 배포 대상 정리"
        run: |
          IMAGE="ghcr.io/${{ github.repository }}:${{ inputs.image_tag }}"
          echo "IMAGE=$IMAGE" >> $GITHUB_ENV
          echo "배포 대상 이미지: $IMAGE"

      # 배포 전후를 비교할 수 있게 현재 값을 먼저 읽는다.
      # 토큰이 잘못됐을 때 여기서 명확하게 죽는 효과도 있다.
      - name: "[2] 현재 서비스 소스 조회"
        env:
          TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
          SERVICE_ID: ${{ secrets.RAILWAY_SERVICE_ID }}
          ENV_ID: ${{ secrets.RAILWAY_ENV_ID }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::RAILWAY_API_TOKEN 시크릿이 없다. https://railway.com/account/tokens 에서 account 또는 workspace 토큰을 발급해 등록할 것."
            exit 1
          fi

          QUERY='query($serviceId: String!, $environmentId: String!) { serviceInstance(serviceId: $serviceId, environmentId: $environmentId) { id source { image } } }'
          BODY=$(jq -n --arg q "$QUERY" --arg s "$SERVICE_ID" --arg e "$ENV_ID" \
            '{query:$q, variables:{serviceId:$s, environmentId:$e}}')

          RESP=$(curl -sS -X POST "$RAILWAY_API" \
            -H "Content-Type: application/json" -H "Authorization: Bearer $TOKEN" -d "$BODY")
          echo "$RESP" | jq .

          CURRENT=$(echo "$RESP" | jq -r '.data.serviceInstance.source.image // empty')
          if [ -z "$CURRENT" ]; then
            echo "::error::서비스 소스를 읽지 못했다. 토큰 종류(account/workspace)와 SERVICE_ID/ENV_ID 를 확인할 것."
            exit 1
          fi
          echo "CURRENT_IMAGE=$CURRENT" >> $GITHUB_ENV

      - name: "[3] 변경 내용 요약"
        run: |
          {
            echo "### Railway 배포"
            echo "- 현재 이미지: \`$CURRENT_IMAGE\`"
            echo "- 배포할 이미지: \`$IMAGE\`"
          } >> $GITHUB_STEP_SUMMARY

      - name: "[4] dry-run 종료"
        if: ${{ inputs.dry_run }}
        run: |
          echo "dry-run 이라 아무것도 바꾸지 않았다."
          echo "실제로 배포하려면 dry_run 을 꺼서 다시 실행할 것."

      - name: "[5] 소스 이미지 고정"
        if: ${{ !inputs.dry_run }}
        env:
          TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
          SERVICE_ID: ${{ secrets.RAILWAY_SERVICE_ID }}
          ENV_ID: ${{ secrets.RAILWAY_ENV_ID }}
        run: |
          MUTATION='mutation($serviceId: String!, $environmentId: String, $input: ServiceInstanceUpdateInput!) { serviceInstanceUpdate(serviceId: $serviceId, environmentId: $environmentId, input: $input) }'
          BODY=$(jq -n --arg q "$MUTATION" --arg s "$SERVICE_ID" --arg e "$ENV_ID" --arg img "$IMAGE" \
            '{query:$q, variables:{serviceId:$s, environmentId:$e, input:{source:{image:$img}}}}')

          RESP=$(curl -sS -X POST "$RAILWAY_API" \
            -H "Content-Type: application/json" -H "Authorization: Bearer $TOKEN" -d "$BODY")
          echo "$RESP" | jq .
          if [ "$(echo "$RESP" | jq -r '.errors // empty')" != "" ]; then
            echo "::error::serviceInstanceUpdate 실패. Not Authorized 면 토큰이 프로젝트 스코프라는 뜻이다."
            exit 1
          fi
          echo "소스 이미지를 $IMAGE 로 고정했다."

      # serviceInstanceUpdate 만으로 배포가 시작되지 않을 수 있어(스테이징) 명시적으로 부른다.
      # 이미 새 이미지로 배포가 돌고 있으면 한 번 더 도는 정도이고 결과는 같다.
      #
      # 배포 뮤테이션 이름은 자료마다 갈린다(serviceInstanceRedeploy / serviceInstanceDeployV2).
      # 둘 다 시도해 통하는 쪽을 쓰고 어느 쪽이었는지 로그에 남긴다.
      # TODO: 한 번 성공한 뒤에는 그쪽 하나로 고정할 것.
      - name: "[6] 배포 트리거"
        if: ${{ !inputs.dry_run }}
        env:
          TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
          SERVICE_ID: ${{ secrets.RAILWAY_SERVICE_ID }}
          ENV_ID: ${{ secrets.RAILWAY_ENV_ID }}
        run: |
          try_mutation() {
            BODY=$(jq -n --arg q "$1" --arg s "$SERVICE_ID" --arg e "$ENV_ID" \
              '{query:$q, variables:{serviceId:$s, environmentId:$e}}')
            curl -sS -X POST "$RAILWAY_API" \
              -H "Content-Type: application/json" -H "Authorization: Bearer $TOKEN" -d "$BODY"
          }

          REDEPLOY='mutation($serviceId: String!, $environmentId: String!) { serviceInstanceRedeploy(serviceId: $serviceId, environmentId: $environmentId) }'
          DEPLOY_V2='mutation($serviceId: String!, $environmentId: String!) { serviceInstanceDeployV2(serviceId: $serviceId, environmentId: $environmentId) }'

          for NAME in serviceInstanceRedeploy serviceInstanceDeployV2; do
            case "$NAME" in
              serviceInstanceRedeploy) Q="$REDEPLOY" ;;
              *)                       Q="$DEPLOY_V2" ;;
            esac
            echo "--- $NAME 시도 ---"
            RESP=$(try_mutation "$Q")
            echo "$RESP" | jq .
            if [ "$(echo "$RESP" | jq -r '.errors // empty')" = "" ]; then
              echo "배포를 시작했다: $IMAGE ($NAME)"
              echo "- 배포 뮤테이션: \`$NAME\`" >> $GITHUB_STEP_SUMMARY
              exit 0
            fi
          done

          echo "::error::두 뮤테이션 모두 실패했다. 소스 이미지는 이미 $IMAGE 로 바뀌었으므로, Railway 대시보드에서 수동 배포하면 반영된다."
          exit 1
