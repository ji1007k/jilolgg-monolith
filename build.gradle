plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.16'
    id 'io.spring.dependency-management' version '1.1.7'
    id "com.github.node-gradle.node" version "7.1.0"
}

node {
    download = false
    version = "22.12.0"
    nodeProjectDir = file("${projectDir}/frontend")
}

group = 'com.test'
version = '1.0.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // Spring Boot Web / Data / Security
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'
    implementation 'org.springframework.boot:spring-boot-starter-webflux'
    implementation 'org.springframework.boot:spring-boot-starter-batch'

    // Push notifications (Firebase)
    implementation 'com.google.firebase:firebase-admin:9.2.0'
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'

    // Distributed lock (Redisson)
    // Not included in Spring BOM, so pin version explicitly.
    // 3.52.0 is built against Spring Boot 3.5.x (redisson-spring-data-35).
    implementation 'org.redisson:redisson-spring-boot-starter:3.52.0'

    // TODO: remove if no longer needed
    implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'

    // PostgreSQL
    runtimeOnly 'org.postgresql:postgresql'

    // Lombok
    // Version is managed by the Spring Boot BOM (1.18.22 did not support Java 21).
    implementation 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    // Entity <-> DTO mapping
    implementation 'org.mapstruct:mapstruct:1.6.3'
    annotationProcessor 'org.mapstruct:mapstruct-processor:1.6.3'

    // Embedded Tomcat for JAR deployment
    implementation 'org.springframework.boot:spring-boot-starter-tomcat'

    developmentOnly 'org.springframework.boot:spring-boot-devtools'

    // OpenAPI / Swagger UI
    // 2.1.0 is incompatible with Spring Boot 3.4+; 2.8.x targets Boot 3.5.
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.17'

    // Monitoring / actuator
    implementation 'org.springframework.boot:spring-boot-starter-actuator'

    // Testing
    testRuntimeOnly 'com.h2database:h2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testImplementation 'org.projectlombok:lombok'
    testAnnotationProcessor 'org.projectlombok:lombok'
    testImplementation 'org.springframework.batch:spring-batch-test'
}

// Use JUnit Platform (JUnit5)
tasks.withType(Test).configureEach {
    useJUnitPlatform()

    // CPU 코어 수의 절반을 사용하여 테스트를 병렬로 실행 (속도 향상)
    maxParallelForks = Runtime.runtime.availableProcessors().intdiv(2) ?: 1

    // 외부 esports API를 실제로 호출하는 테스트는 CI에서 제외한다.
    // 우리 코드와 무관하게 외부 서비스 상태에 따라 실패해서, PR 검증을 신뢰할 수 없게 만든다.
    // 로컬에서는 그냥 ./gradlew test 로 전부 돌린다.
    if (project.hasProperty("excludeExternalApiTests")) {
        exclude "**/LolEsportsApiClientIntergrationTest.class"
        exclude "**/SyncMatchJobTest.class"
    }
}

// bootRun은 애플리케이션을 별도 JVM으로 띄우기 때문에, Gradle JVM에 준
// -Dspring.xxx 시스템 프로퍼티가 그대로는 전달되지 않는다.
// 그래서 `./gradlew bootRun -Dspring.profiles.active=dev`가 조용히 무시되고
// 기본값인 prod 프로필로 떠서 DataSource 오류로 죽는다.
// spring.* 프로퍼티만 골라 앱 JVM으로 넘겨 문서화된 명령이 실제로 동작하게 한다.
tasks.named('bootRun') {
    System.properties.each { key, value ->
        if (key.toString().startsWith('spring.')) {
            systemProperty(key.toString(), value)
        }
    }
}

// Force Java compile encoding
tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}

// Force resource filtering encoding
processResources {
    filteringCharset = 'UTF-8'
}

task buildFrontend(type: NpmTask) {
    args = ['run', 'build']
}

task copyFrontend(type: Copy) {
    from "${projectDir}/frontend/out"
    into "${projectDir}/src/main/resources/static/jikimi"
}

// Skip npm install if node_modules already exists
npmInstall.onlyIf {
    !file("${projectDir}/frontend/node_modules").exists()
}

buildFrontend.dependsOn npmInstall
copyFrontend.dependsOn buildFrontend

// Keep Java build/run separate from frontend build by default.
// Include frontend artifacts only when explicitly requested.
if (project.hasProperty("withFrontend")) {
    processResources.dependsOn copyFrontend
}

// build.gradle 파일 맨 밑에 추가
jar {
    enabled = false // 의존성이 제외된 순수 자바 클래스 파일인 plain.jar 생성을 아예 막기
}