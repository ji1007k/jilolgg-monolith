name: "[CD] Railway 이미지 배포"

# Railway 서비스가 바라보는 이미지를 지정한 태그로 "고정"하고 배포한다.
#
# 왜 railway CLI 를 쓰지 않는가:
#   railway redeploy 는 서비스에 설정된 태그를 그대로 다시 당긴다. 그 태그가
#   :latest 면 언제나 그 시점의 최신 다이제스트를 가져오므로, 배포가 재현되지
#   않고 롤백도 불가능하다(Railway 문서: "For tags without versions ... Railway
#   redeploys the existing tag to pull the latest image digest").
#   그리고 CLI 4.16.1 에는 이미지 태그를 바꾸는 명령 자체가 없다.
#   따라서 public GraphQL API 로 소스 이미지를 바꾼 뒤 배포한다.
#
# 사용처:
#   - release-main.yml 이 workflow_call 로 부른다(커밋 sha 태그 배포)
#   - 롤백은 workflow_dispatch 로 직접 실행한다(되돌릴 태그를 입력)

on:
  workflow_call:
    inputs:
      image_tag:
        required: true
        type: string
      # 호출 쪽에서는 항상 실제 배포다. 아래 조건식이 입력 없음(null)에 기대지
      # 않도록 명시적으로 선언해 둔다.
      dry_run:
        required: false
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      image_tag:
        description: "배포할 GHCR 이미지 태그 (예: a1b2c3d, v1.2.0). 롤백은 여기에 이전 태그를 넣는다"
        required: true
        type: string
      dry_run:
        description: "실제로 바꾸지 않고 현재 상태와 바뀔 내용만 출력한다"
        required: false
        type: boolean
        default: true

env:
  RAILWAY_API: https://backboard.railway.com/graphql/v2

jobs:
  deploy:
    name: "[CD] Railway 재배포"
    runs-on: ubuntu-latest

    steps:
      - name: "[1] 배포 대상 정리"
        run: |
          IMAGE="ghcr.io/${{ github.repository }}:${{ inputs.image_tag }}"
          echo "IMAGE=$IMAGE" >> $GITHUB_ENV
          echo "배포 대상 이미지: $IMAGE"

      # 프로젝트 토큰은 Project-Access-Token 헤더를, 계정/워크스페이스 토큰은
      # Authorization: Bearer 를 쓴다. 어느 쪽이 쓰기 권한을 갖는지 확인되지
      # 않았으므로 둘 다 시도해 통하는 쪽을 고른다. 결과는 AUTH_HEADER 로 남긴다.
      - name: "[2] 현재 서비스 소스 조회 & 인증 방식 판별"
        env:
          TOKEN: ${{ secrets.RAILWAY_PROJECT_TOKEN }}
          SERVICE_ID: ${{ secrets.RAILWAY_SERVICE_ID }}
          ENV_ID: ${{ secrets.RAILWAY_ENV_ID }}
        run: |
          QUERY='query($serviceId: String!, $environmentId: String!) { serviceInstance(serviceId: $serviceId, environmentId: $environmentId) { id source { image } } }'
          BODY=$(jq -n --arg q "$QUERY" --arg s "$SERVICE_ID" --arg e "$ENV_ID" \
            '{query:$q, variables:{serviceId:$s, environmentId:$e}}')

          FOUND=""
          for NAME in "Authorization" "Project-Access-Token"; do
            case "$NAME" in
              Authorization) VALUE="Bearer $TOKEN" ;;
              *)             VALUE="$TOKEN" ;;
            esac
            echo "--- $NAME 로 시도 ---"
            RESP=$(curl -sS -X POST "$RAILWAY_API" \
              -H "Content-Type: application/json" -H "$NAME: $VALUE" -d "$BODY")
            # 응답은 그대로 남긴다. 필드명이 틀렸을 때 에러 메시지가 정답을 알려준다.
            echo "$RESP" | jq .
            if [ "$(echo "$RESP" | jq -r '.data.serviceInstance.id // empty')" != "" ]; then
              FOUND="$NAME"
              # 이름과 값을 따로 남긴다. Authorization 은 "Bearer " 접두사가 붙고
              # Project-Access-Token 은 붙지 않아, 이름만으로는 재구성할 수 없다.
              echo "AUTH_HEADER=$NAME" >> $GITHUB_ENV
              echo "AUTH_VALUE=$VALUE" >> $GITHUB_ENV
              echo "CURRENT_IMAGE=$(echo "$RESP" | jq -r '.data.serviceInstance.source.image // "(없음)"')" >> $GITHUB_ENV
              break
            fi
          done

          if [ -z "$FOUND" ]; then
            echo "::error::두 헤더 모두 서비스를 읽지 못했다. 토큰 종류나 서비스/환경 ID를 확인할 것."
            exit 1
          fi
          echo "인증 방식: $FOUND"

      - name: "[3] 변경 내용 요약"
        run: |
          {
            echo "### Railway 배포"
            echo "- 인증 헤더: \`$AUTH_HEADER\`"
            echo "- 현재 이미지: \`$CURRENT_IMAGE\`"
            echo "- 배포할 이미지: \`$IMAGE\`"
          } >> $GITHUB_STEP_SUMMARY

      - name: "[4] dry-run 종료"
        if: ${{ inputs.dry_run }}
        run: |
          echo "dry-run 이라 아무것도 바꾸지 않았다."
          echo "실제로 배포하려면 dry_run 을 꺼서 다시 실행할 것."

      - name: "[5] 소스 이미지 고정"
        if: ${{ !inputs.dry_run }}
        env:
          SERVICE_ID: ${{ secrets.RAILWAY_SERVICE_ID }}
          ENV_ID: ${{ secrets.RAILWAY_ENV_ID }}
        run: |
          MUTATION='mutation($serviceId: String!, $environmentId: String, $input: ServiceInstanceUpdateInput!) { serviceInstanceUpdate(serviceId: $serviceId, environmentId: $environmentId, input: $input) }'
          BODY=$(jq -n --arg q "$MUTATION" --arg s "$SERVICE_ID" --arg e "$ENV_ID" --arg img "$IMAGE" \
            '{query:$q, variables:{serviceId:$s, environmentId:$e, input:{source:{image:$img}}}}')

          RESP=$(curl -sS -X POST "$RAILWAY_API" \
            -H "Content-Type: application/json" -H "$AUTH_HEADER: $AUTH_VALUE" -d "$BODY")
          echo "$RESP" | jq .
          if [ "$(echo "$RESP" | jq -r '.errors // empty')" != "" ]; then
            echo "::error::serviceInstanceUpdate 실패"
            exit 1
          fi
          echo "소스 이미지를 $IMAGE 로 고정했다."

      # serviceInstanceUpdate 만으로 배포가 시작되지 않을 수 있어(스테이징) 명시적으로 부른다.
      # 이미 새 이미지로 배포가 돌고 있으면 한 번 더 도는 정도이고 결과는 같다.
      - name: "[6] 배포 트리거"
        if: ${{ !inputs.dry_run }}
        env:
          SERVICE_ID: ${{ secrets.RAILWAY_SERVICE_ID }}
          ENV_ID: ${{ secrets.RAILWAY_ENV_ID }}
        run: |
          MUTATION='mutation($serviceId: String!, $environmentId: String!) { serviceInstanceRedeploy(serviceId: $serviceId, environmentId: $environmentId) }'
          BODY=$(jq -n --arg q "$MUTATION" --arg s "$SERVICE_ID" --arg e "$ENV_ID" \
            '{query:$q, variables:{serviceId:$s, environmentId:$e}}')

          RESP=$(curl -sS -X POST "$RAILWAY_API" \
            -H "Content-Type: application/json" -H "$AUTH_HEADER: $AUTH_VALUE" -d "$BODY")
          echo "$RESP" | jq .
          if [ "$(echo "$RESP" | jq -r '.errors // empty')" != "" ]; then
            echo "::error::배포 트리거 실패. 뮤테이션 이름이 바뀌었을 수 있다(serviceInstanceDeployV2 확인)."
            exit 1
          fi
          echo "배포를 시작했다: $IMAGE"
