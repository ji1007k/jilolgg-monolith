name: "[CD] Railway 수동 재배포"

# 평상시 배포는 release-main.yml 의 deploy 잡이 담당한다
# (이미지 빌드와 같은 실행 안에서 needs 로 순서를 보장).
#
# 이 워크플로는 코드 변경 없이 현재 GHCR 이미지로 다시 띄우고 싶을 때만 쓴다.
# 예: 컨테이너가 죽었을 때, 환경변수만 바꿨을 때.
# 새 코드를 배포하려면 여기가 아니라 main 에 머지해야 한다(이미지가 다시 구워진다).
on:
  workflow_dispatch:

jobs:
  redeploy:
    name: "[CD] 현재 이미지로 재배포"
    runs-on: ubuntu-latest

    steps:
      - name: "[1] 안내"
        run: |
          echo "GHCR 의 현재 latest 이미지로 재배포합니다."
          echo "새 코드를 반영하려면 main 에 머지해 이미지를 다시 구워야 합니다."

      - name: "[2] Railway CLI 설치"
        run: npm install -g @railway/cli

      - name: "[3] Railway 재배포 트리거"
        run: |
          railway redeploy \
            --service "${{ secrets.RAILWAY_SERVICE_ID }}" \
            -y
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_PROJECT_TOKEN }}
          RAILWAY_PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID }}
          RAILWAY_ENVIRONMENT_ID: ${{ secrets.RAILWAY_ENV_ID }}
